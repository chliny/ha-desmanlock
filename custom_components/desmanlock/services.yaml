get_dynamic_password:
  fields:
    lock_id:
      selector:
        text:
      required: false

get_digit_passwords:
  fields:
    lock_id:
      selector:
        text:
      required: false

add_digit_password:
  fields:
    lock_id:
      selector:
        text:
      required: false
    real_time_switch:
      selector:
        number:
          min: 0
          max: 1
          mode: box
      required: true
    range_time:
      selector:
        text:
      required: true
    remarks:
      selector:
        text:
      required: false
    alarm_switch:
      selector:
        number:
          min: 0
          max: 1
          mode: box
      required: false

update_digit_password:
  fields:
    id:
      selector:
        text:
      required: true
    remarks:
      selector:
        text:
      required: false
    real_time_switch:
      selector:
        number:
          min: 0
          max: 1
          mode: box
      required: true
    range_time:
      selector:
        text:
      required: true
    state:
      selector:
        number:
          min: 0
          mode: box
      required: true

cleanup_snapshots:
  name: Clean up alarm snapshots
  description: Delete alarm snapshots older than the retention window (default 30 days).
  fields:
    retention_days:
      name: Retention days
      description: Delete snapshots older than this many days.
      selector:
        number:
          min: 1
          max: 3650
          mode: box
      required: false
      default: 30
